name: In-game screenshots

# Launches the real client on a virtual display and photographs the menus, so UI work can be
# checked without a local game. Start it by hand from the Actions tab.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  screenshots:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: Install a virtual display
        run: sudo apt-get update && sudo apt-get install -y xvfb

      - name: Run the screenshot test
        run: chmod +x gradlew && ./gradlew runClientGameTest --stacktrace --no-daemon --console=plain

      - name: List screenshots
        if: always()
        run: find . -name "*.png" -path "*screenshots*" -newer build.gradle | sort | head -100

      - name: Publish screenshots to a temporary branch
        if: always()
        run: |
          mkdir -p /tmp/shots
          find . -name "*.png" -path "*screenshots*" -newer build.gradle -exec cp {} /tmp/shots/ \;
          ls /tmp/shots | head -80
          cd /tmp/shots
          git init -q
          git checkout -q -b ci-screenshots
          git add -A
          git -c user.name="github-actions" -c user.email="github-actions@users.noreply.github.com" commit -q -m "Screenshots for ${GITHUB_SHA}" || exit 0
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" ci-screenshots

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots
          path: |
            **/screenshots/*.png
            build/run/**/logs/latest.log
          if-no-files-found: warn
