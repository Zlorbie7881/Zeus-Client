name: In-game screenshots

# Launches the real client on a virtual display and photographs the menus, so UI work can be
# checked without a local game. Runs on the feature branch only.
on:
  push:
    branches: [knife-types]

jobs:
  screenshots:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: Install a virtual display
        run: sudo apt-get update && sudo apt-get install -y xvfb

      - name: Run the screenshot test
        run: ./gradlew runClientGameTest --stacktrace

      - name: List screenshots
        if: always()
        run: find . -name "*.png" -path "*screenshots*" -newer build.gradle | sort | head -100

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots
          path: |
            **/screenshots/*.png
            build/run/**/logs/latest.log
          if-no-files-found: warn
